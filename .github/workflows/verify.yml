# Waymark 2.0.18 · point 1 (docs/adr/0029): the suite and the verification, on every push, pull request and release tag.
# Third-party actions are pinned to a commit (the tag is in the comment); a pinned input is what the scorecard asks of Waymark itself.
name: verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: the suite, three runs, nothing skipped, todo or failing
        run: node scripts/gate-tests.mjs
      - name: the chain of the records
        run: node skills/waymark/scripts/waymark.mjs verify
      - name: the files against the manifest
        run: node skills/waymark/scripts/waymark.mjs verify --install
      - name: the manifest's signature, required on a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node skills/waymark/scripts/waymark.mjs verify --install --require-signature
